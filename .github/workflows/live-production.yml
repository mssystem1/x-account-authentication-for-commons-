name: Live Production Validation

on:
  workflow_dispatch:
    inputs:
      handle:
        description: Commons creator X handle to audit
        required: true
        default: natalia77351991

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify health and real Commons audit
        shell: bash
        env:
          HANDLE: ${{ inputs.handle }}
        run: |
          set -euo pipefail
          BASE="https://vouchguard-ai.vercel.app"

          curl --location --fail --silent --show-error "$BASE/" > /tmp/root.html
          curl --location --fail --silent --show-error "$BASE/api/health" > /tmp/health.json

          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          console.log('Production health:', h);
          if (!h.ok || h.mode !== 'live') throw new Error('Production runtime is not healthy');
          if (h.primaryData !== 'commons-ledger' || h.xApiRequired !== false) throw new Error('Commons-ledger architecture is not live');
          if (h.methodologyVersion !== 'vg-commons-2026.08.1') throw new Error(`Expected vg-commons-2026.08.1, got ${h.methodologyVersion}`);
          NODE

          HTTP="$(curl --location --silent --show-error --output /tmp/audit.json --write-out '%{http_code}' \
            -X POST "$BASE/api/scan" \
            -H 'Content-Type: application/json' \
            --data "{\"handle\":\"$HANDLE\",\"refresh\":true}")"
          echo "Audit HTTP=$HTTP"
          if [ "$HTTP" != "200" ]; then
            cat /tmp/audit.json
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          console.log(JSON.stringify({
            handle:r.handle,
            commons:r.commons,
            metrics:r.metrics,
            stats:r.stats,
            verdict:r.report?.verdict,
            reportConfidence:r.report?.confidence,
            supporters:r.supporters?.length,
            sourceEntries:r.sourceEntries?.length
          }, null, 2));
          if (r.mode !== 'live') throw new Error('Not a live audit');
          if (typeof r.metrics?.integrityScore !== 'number') throw new Error('Missing Commons Integrity score');
          if (!r.stats || typeof r.stats.uniqueVouchers !== 'number') throw new Error('Missing Commons network stats');
          if (!Array.isArray(r.supporters)) throw new Error('Missing supporter graph rows');
          if (!Array.isArray(r.sourceEntries)) throw new Error('Missing target Commons ledger events');
          if (!r.report?.verdict) throw new Error('Missing integrity verdict');
          if (r.methodologyVersion !== 'vg-commons-2026.08.1') throw new Error(`Unexpected methodology ${r.methodologyVersion}`);
          NODE
