name: Live Production Validation

on:
  workflow_dispatch:
    inputs:
      handle:
        description: X handle to scan
        required: true
        default: natalia77351991

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify health and real account scan
        shell: bash
        env:
          HANDLE: ${{ inputs.handle }}
        run: |
          set -euo pipefail
          BASE="https://vouchguard-ai.vercel.app"

          curl --location --fail --silent --show-error "$BASE/" > /tmp/root.html
          curl --location --fail --silent --show-error "$BASE/api/health" > /tmp/health.json

          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          console.log('Production health:', h);
          if (!h.ok || h.mode !== 'live' || !h.xaiConfigured) throw new Error('Production xAI runtime is not healthy');
          if (!h.xApiConfigured || h.retrieval !== 'official-x-api') throw new Error('Production X_BEARER_TOKEN is not configured');
          if (h.methodologyVersion !== 'vg-2026.08.7') throw new Error(`Expected vg-2026.08.7, got ${h.methodologyVersion}`);
          NODE

          HTTP="$(curl --location --silent --show-error --output /tmp/scan.json --write-out '%{http_code}' \
            -X POST "$BASE/api/scan" \
            -H 'Content-Type: application/json' \
            --data "{\"handle\":\"$HANDLE\",\"refresh\":true}")"
          echo "Scan HTTP=$HTTP"
          if [ "$HTTP" != "200" ]; then
            cat /tmp/scan.json
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/scan.json','utf8'));
          console.log(JSON.stringify({
            handle:r.handle,
            recommendation:r.recommendation,
            scores:r.scores,
            confidence:r.confidence,
            coverage:r.coverage,
            diagnostics:r.diagnostics,
            sources:r.sourceUrls?.length,
            evidence:r.evidence?.length,
            summary:r.summary
          }, null, 2));
          if (r.mode !== 'live') throw new Error('Not a live scan');
          if (r.diagnostics?.retrievalMode !== 'x-api') throw new Error('Official X API was not used');
          if (!r.coverage?.profileResolved) throw new Error('X profile was not resolved');
          if (r.coverage.postsObserved < 5) throw new Error('Insufficient deterministic post coverage');
          if (r.diagnostics?.analysisSampleSize !== 5) throw new Error(`Expected five-post quick scan, got ${r.diagnostics?.analysisSampleSize}`);
          if (typeof r.diagnostics?.estimatedXReadCostUsd !== 'number' || r.diagnostics.estimatedXReadCostUsd > 0.035001) {
            throw new Error(`X-side read estimate exceeded $0.035: ${r.diagnostics?.estimatedXReadCostUsd}`);
          }
          if (!r.scores) throw new Error('Production scan remained unscorable');
          const values=[r.scores.authenticity,r.scores.farmerRisk,r.scores.botRisk,r.scores.sybilRisk,r.scores.vouchConfidence];
          if (values.every(v=>v===50)) throw new Error('Regression: all-50 placeholder vector returned');
          NODE
