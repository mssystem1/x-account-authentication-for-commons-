name: Check Vercel aliases

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/check-vercel-aliases.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: vouchguard-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link project and temporarily disable Vercel Authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN"
          cat > /tmp/protection.json <<'JSON'
          {
            "ssoProtection": null
          }
          JSON
          vercel api "/v9/projects/$VERCEL_PROJECT_NAME" -X PATCH --input /tmp/protection.json --token "$VERCEL_TOKEN" > /tmp/protection-result.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("/tmp/protection-result.json","utf8")); console.log("ssoProtection", p.ssoProtection ?? null)'

      - name: Probe public Vercel endpoints
        shell: bash
        run: |
          set -u
          URLS=(
            "https://vouchguard-ai.vercel.app"
            "https://vouchguard-commons-ai.vercel.app"
            "https://vouchguard-ai-maksims-projects-209202f7.vercel.app"
            "https://vouchguard-ai-git-main-maksims-projects-209202f7.vercel.app"
            "https://vouchguard-4alenksxu-maksims-projects-209202f7.vercel.app"
          )
          for URL in "${URLS[@]}"; do
            echo "=== $URL ==="
            ROOT="$(curl --silent --output /tmp/root --write-out '%{http_code}' "$URL/" || true)"
            HEALTH="$(curl --silent --output /tmp/health --write-out '%{http_code}' "$URL/api/health" || true)"
            CONTENT_TYPE="$(curl --silent --output /dev/null --write-out '%{content_type}' "$URL/api/health" || true)"
            LOCATION="$(curl --silent --head "$URL/api/health" | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print substr($0,11)}' | head -1)"
            TITLE="$(grep -o -m1 '<title>[^<]*</title>' /tmp/health 2>/dev/null || true)"
            echo "root=$ROOT health=$HEALTH content-type=$CONTENT_TYPE"
            echo "location=$LOCATION"
            echo "title=$TITLE"
            echo "health-prefix: $(head -c 350 /tmp/health 2>/dev/null || true)"
          done
