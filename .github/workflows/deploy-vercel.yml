name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-vercel.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-vercel.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      VERCEL_PROJECT_NAME: vouchguard-ai
      PRODUCTION_DOMAIN: vouchguard-ai.vercel.app
      RECOVERY_DOMAIN: vouchguard-commons-ai.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          test -n "$XAI_API_KEY" || { echo "XAI_API_KEY is missing"; exit 1; }
          echo "Required deployment credentials are configured."

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Validate application before deployment
        env:
          VOUCHGUARD_DEMO_MODE: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create or link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          if ! vercel project inspect "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "Creating Vercel project $VERCEL_PROJECT_NAME"
            vercel api /v9/projects -X POST -F "name=$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/tmp/vercel-project.json
          else
            echo "Vercel project already exists."
          fi
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN"

      - name: Make production domains public
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/protection.json <<'JSON'
          {
            "ssoProtection": {
              "deploymentType": "prod_deployment_urls_and_all_previews"
            }
          }
          JSON
          vercel api "/v9/projects/$VERCEL_PROJECT_NAME" -X PATCH --input /tmp/protection.json --token "$VERCEL_TOKEN" > /tmp/protection-result.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("/tmp/protection-result.json","utf8")); console.log("ssoProtection", p.ssoProtection ?? null)'

      - name: Configure production environment
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$XAI_API_KEY" > /tmp/xai-key
          printf '%s' 'grok-4.5-latest' > /tmp/xai-model
          printf '%s' '21600' > /tmp/cache-ttl
          printf '%s' '12' > /tmp/rate-limit
          printf '%s' 'false' > /tmp/demo-mode
          printf '%s' "https://$RECOVERY_DOMAIN" > /tmp/app-url

          vercel env add XAI_API_KEY production --sensitive --force --token "$VERCEL_TOKEN" < /tmp/xai-key
          vercel env add XAI_MODEL production --force --token "$VERCEL_TOKEN" < /tmp/xai-model
          vercel env add SCAN_CACHE_TTL_SECONDS production --force --token "$VERCEL_TOKEN" < /tmp/cache-ttl
          vercel env add SCAN_RATE_LIMIT_PER_MINUTE production --force --token "$VERCEL_TOKEN" < /tmp/rate-limit
          vercel env add VOUCHGUARD_DEMO_MODE production --force --token "$VERCEL_TOKEN" < /tmp/demo-mode
          vercel env add NEXT_PUBLIC_APP_URL production --no-sensitive --force --token "$VERCEL_TOKEN" < /tmp/app-url
          rm -f /tmp/xai-key /tmp/xai-model /tmp/cache-ttl /tmp/rate-limit /tmp/demo-mode /tmp/app-url

      - name: Create or verify Vercel Blob cache
        shell: bash
        run: |
          set -euo pipefail
          if vercel blob create-store vouchguard-cache --access public --token "$VERCEL_TOKEN"; then
            echo "Created and connected vouchguard-cache Blob store."
          else
            echo "Blob store creation returned a non-zero status. It may already exist; continuing to deployment and validating storage via /api/health."
          fi

      - name: Connect GitHub repository
        run: vercel git connect --yes --token "$VERCEL_TOKEN" || echo "Git integration could not be connected automatically; CLI deployment will still proceed."

      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Generated production deployment: $DEPLOYMENT_URL"

      - name: Recreate original production alias
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL='${{ steps.deploy.outputs.url }}'
          vercel alias rm "$PRODUCTION_DOMAIN" --yes --token "$VERCEL_TOKEN" || true
          sleep 2
          vercel alias set "$DEPLOYMENT_URL" "$PRODUCTION_DOMAIN" --token "$VERCEL_TOKEN"

      - name: Create recovery production alias
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL='${{ steps.deploy.outputs.url }}'
          vercel alias rm "$RECOVERY_DOMAIN" --yes --token "$VERCEL_TOKEN" || true
          sleep 2
          vercel alias set "$DEPLOYMENT_URL" "$RECOVERY_DOMAIN" --token "$VERCEL_TOKEN"
          vercel alias ls --limit 100 --token "$VERCEL_TOKEN"

      - name: Confirm generated deployment exists
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.url }}'
          STATUS="$(curl --silent --output /tmp/generated --write-out '%{http_code}' "$URL/" || true)"
          LOCATION="$(curl --silent --head "$URL/" | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print substr($0,11)}' | head -1)"
          echo "Generated deployment direct status=$STATUS location=$LOCATION"
          test "$STATUS" = "200" -o "$STATUS" = "302" -o "$STATUS" = "307"

      - name: Verify fresh public recovery alias
        shell: bash
        run: |
          set -euo pipefail
          URL="https://$RECOVERY_DOMAIN"
          for attempt in {1..18}; do
            ROOT_STATUS="$(curl --silent --output /tmp/recovery-root.html --write-out '%{http_code}' "$URL/" || true)"
            HEALTH_STATUS="$(curl --silent --output /tmp/recovery-health.json --write-out '%{http_code}' "$URL/api/health" || true)"
            CONTENT_TYPE="$(curl --silent --output /dev/null --write-out '%{content_type}' "$URL/api/health" || true)"
            echo "Attempt $attempt: root=$ROOT_STATUS health=$HEALTH_STATUS content-type=$CONTENT_TYPE"
            if [ "$ROOT_STATUS" = "200" ] && [ "$HEALTH_STATUS" = "200" ] && [[ "$CONTENT_TYPE" == application/json* ]]; then
              node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("/tmp/recovery-health.json","utf8")); console.log("recovery health", h); if(!h.ok || h.mode!=="live" || !h.xaiConfigured) process.exit(1)'
              echo "RECOVERY_ALIAS_OK=https://$RECOVERY_DOMAIN"
              exit 0
            fi
            sleep 5
          done
          echo "Recovery alias failed. Direct headers:"
          curl --silent --head "$URL/api/health" | head -15 || true
          exit 1

      - name: Probe original canonical alias
        if: always()
        shell: bash
        run: |
          ROOT_STATUS="$(curl --silent --output /tmp/canonical-root.html --write-out '%{http_code}' "https://$PRODUCTION_DOMAIN/" || true)"
          HEALTH_STATUS="$(curl --silent --output /tmp/canonical-health.json --write-out '%{http_code}' "https://$PRODUCTION_DOMAIN/api/health" || true)"
          echo "Original canonical: root=$ROOT_STATUS health=$HEALTH_STATUS"

      - name: Production URL summary
        if: always()
        run: |
          echo "### VouchGuard production" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery public URL: https://$RECOVERY_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Original alias: https://$PRODUCTION_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

# standard protection + public recovery alias validation
