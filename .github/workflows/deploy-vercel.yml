name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-vercel.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-vercel.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      VERCEL_PROJECT_NAME: vouchguard-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          test -n "$XAI_API_KEY" || { echo "XAI_API_KEY is missing"; exit 1; }
          echo "Required deployment credentials are configured."

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Validate application before deployment
        env:
          VOUCHGUARD_DEMO_MODE: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create or link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          if ! vercel project inspect "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "Creating Vercel project $VERCEL_PROJECT_NAME"
            vercel api /v9/projects -X POST -F "name=$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/tmp/vercel-project.json
          else
            echo "Vercel project already exists."
          fi
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN"

      - name: Configure production environment
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$XAI_API_KEY" > /tmp/xai-key
          printf '%s' 'grok-4.5-latest' > /tmp/xai-model
          printf '%s' '21600' > /tmp/cache-ttl
          printf '%s' '12' > /tmp/rate-limit
          printf '%s' 'false' > /tmp/demo-mode

          vercel env add XAI_API_KEY production --sensitive --force --token "$VERCEL_TOKEN" < /tmp/xai-key
          vercel env add XAI_MODEL production --force --token "$VERCEL_TOKEN" < /tmp/xai-model
          vercel env add SCAN_CACHE_TTL_SECONDS production --force --token "$VERCEL_TOKEN" < /tmp/cache-ttl
          vercel env add SCAN_RATE_LIMIT_PER_MINUTE production --force --token "$VERCEL_TOKEN" < /tmp/rate-limit
          vercel env add VOUCHGUARD_DEMO_MODE production --force --token "$VERCEL_TOKEN" < /tmp/demo-mode
          rm -f /tmp/xai-key /tmp/xai-model /tmp/cache-ttl /tmp/rate-limit /tmp/demo-mode

      - name: Create or verify Vercel Blob cache
        shell: bash
        run: |
          set -euo pipefail
          if vercel blob create-store vouchguard-cache --access public --token "$VERCEL_TOKEN"; then
            echo "Created and connected vouchguard-cache Blob store."
          else
            echo "Blob store creation returned a non-zero status. It may already exist; continuing to deployment and validating storage via /api/health."
          fi

      - name: Connect GitHub repository
        run: vercel git connect --yes --token "$VERCEL_TOKEN" || echo "Git integration could not be connected automatically; CLI deployment will still proceed."

      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production: $DEPLOYMENT_URL"

      - name: Verify production health and storage
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.url }}'
          for attempt in {1..18}; do
            if curl --location --fail --silent --show-error "$URL/api/health" | tee /tmp/health.json; then
              node -e 'const h=require("/tmp/health.json"); if(!h.ok || h.mode!=="live" || !h.xaiConfigured || h.storage!=="vercel-blob") { console.error("Invalid production health", h); process.exit(1); } console.log("VouchGuard production health and Blob check passed", h)'
              exit 0
            fi
            sleep 5
          done
          echo "Production health check did not pass."
          exit 1

      - name: Production URL summary
        run: |
          echo "### VouchGuard production" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
