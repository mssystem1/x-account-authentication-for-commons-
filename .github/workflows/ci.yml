name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOUCHGUARD_DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: E2E simulation
        run: npm run test:e2e
      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile UI QA
        run: npm run test:ui
      - name: Investigate live Commons cases
        run: node scripts/production-investigation.mjs
