name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VOUCHGUARD_DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: E2E simulation
        run: npm run test:e2e

  live-production-regression:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for vg-2026.08.5 and scan @natalia77351991
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vouchguard-ai.vercel.app"
          READY=0

          for attempt in {1..60}; do
            ROOT="$(curl --location --silent --output /tmp/root.html --write-out '%{http_code}' "$BASE/" || true)"
            HEALTH="$(curl --location --silent --output /tmp/health.json --write-out '%{http_code}' "$BASE/api/health" || true)"
            echo "Attempt $attempt root=$ROOT health=$HEALTH"
            if [ "$ROOT" = "200" ] && [ "$HEALTH" = "200" ]; then
              if node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if (!h.ok || h.mode !== 'live' || !h.xaiConfigured || h.methodologyVersion !== 'vg-2026.08.5') process.exit(1);
          console.log('Fresh production health', h);
          NODE
              then
                READY=1
                break
              fi
            fi
            sleep 10
          done

          if [ "$READY" != "1" ]; then
            echo "Fresh production did not become reachable with vg-2026.08.5."
            head -c 600 /tmp/root.html || true
            echo
            head -c 600 /tmp/health.json || true
            exit 1
          fi

          HTTP="$(curl --location --silent --show-error --output /tmp/scan.json --write-out '%{http_code}' \
            -X POST "$BASE/api/scan" \
            -H 'Content-Type: application/json' \
            --data '{"handle":"natalia77351991","refresh":true}')"
          echo "Scan HTTP=$HTTP"
          if [ "$HTTP" != "200" ]; then
            cat /tmp/scan.json
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/scan.json','utf8'));
          const out={
            handle:r.handle,
            mode:r.mode,
            model:r.model,
            recommendation:r.recommendation,
            scores:r.scores,
            confidence:r.confidence,
            coverage:r.coverage,
            diagnostics:r.diagnostics,
            sourceCount:Array.isArray(r.sourceUrls)?r.sourceUrls.length:null,
            evidenceCount:Array.isArray(r.evidence)?r.evidence.length:null,
            summary:r.summary
          };
          console.log(JSON.stringify(out,null,2));
          if (r.handle !== 'natalia77351991') throw new Error('Wrong account returned');
          if (r.mode !== 'live') throw new Error('Not a live scan');
          if (r.scores) {
            const values=[r.scores.authenticity,r.scores.farmerRisk,r.scores.botRisk,r.scores.sybilRisk,r.scores.vouchConfidence];
            if (values.every(v=>v===50)) throw new Error('Regression: all-50 scores returned');
            if (r.diagnostics?.neutralVectorDetected) throw new Error('Neutral vector should not be scored');
            if (!r.coverage || r.coverage.postsObserved < 5) throw new Error('Scored result lacks minimum direct X coverage');
            if (r.diagnostics?.retrievalMode === 'recovery' && r.diagnostics?.directTargetSources < 1) throw new Error('Recovery result lacks verified direct target sources');
          } else if (r.recommendation !== 'UNSCORABLE') {
            throw new Error('Missing scores must be UNSCORABLE');
          }
          NODE
